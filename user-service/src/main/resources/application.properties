server.port=8081
spring.application.name=user-service
# Connect to Postgres database
spring.datasource.url=jdbc:postgresql://localhost:5432/fitness_user_db
spring.datasource.username=postgres
spring.datasource.password=password

# Hibernate compares entity classes (annotated with @Entity)
# with existing database schema
# Do not use "update" option in production, instead use
# versioned migration tools like Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
